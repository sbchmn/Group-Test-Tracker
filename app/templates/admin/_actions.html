{% macro more_menu(id, label='More') -%}
<div class="dropdown">
    <button type="button" id="{{ id }}" class="btn btn-sm btn-outline-secondary dropdown-toggle w-100" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-three-dots me-1" aria-hidden="true"></i>{{ label }}</button>
    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="{{ id }}">{{ caller() }}</ul>
</div>
{%- endmacro %}
