{% extends "base.html" %}

{% block title %}{{ app_name }} Version{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body">
                <p class="text-uppercase text-muted small mb-2">Application Version</p>
                <h1 class="h3 mb-3">{{ app_name }} <span class="text-muted">v{{ app_version }}</span></h1>
                <p class="mb-0">{{ app_release }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
